# Reviewed security-policy template. The complete executable workflow remains
# .github/workflows/release.yml and is covered by repository workflow tests.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact reviewed main commit (40-character lowercase SHA)
        required: true
        type: string
      pull_request:
        description: Final reviewed pull request merged as this main commit
        required: true
        type: string

permissions:
  contents: read

# The full executable two-phase workflow is intentionally maintained in
# .github/workflows/release.yml. This template records its security contract:
# candidate verifies the final merged PR/current-head review/required checks and
# packages an exact current main SHA with read-only contents. Release-environment
# approval unlocks the only contents:write job, which creates one annotated tag
# and publishes the already verified, manifest-bound closed asset set. A failed
# promotion is recovered only by rerunning the failed job in that same run.
