# Reviewed security-policy template. The complete executable workflow remains
# .github/workflows/release.yml and is covered by repository workflow tests.
name: release

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Reviewed release source branch (main or approved maintenance)
        required: true
        type: string
      commit:
        description: Exact reviewed release-branch head (40-character lowercase SHA)
        required: true
        type: string
      pull_request:
        description: Final reviewed pull request merged as this release-branch commit
        required: true
        type: string

permissions:
  contents: read

# The full executable two-phase workflow is intentionally maintained in
# .github/workflows/release.yml. This template records its security contract:
# one bounded read-only Python collector obtains fresh repository-admission
# evidence at the candidate, immediately pre-tag, and immediately pre-Release
# boundaries. It verifies the exact remote-main SHA, protected flag, applied
# required-check rules, exact successful check runs, fully paginated review
# threads and unresolved-thread comments, and the stable-tag update/deletion
# ruleset for an exact selected release-branch head. A visible bypass_actors
# value must be exactly empty. When GitHub omits it from least-privilege API
# responses, the protected-environment release owner separately attests that
# the matching ruleset has no bypass actors. Product source is current main or the explicit
# 0.9.17/0.9.17, 0.9.18/0.9.18, and 0.9.19/0.9.19 maintenance pairs. Release-environment approval unlocks the only
# contents:write job, which checks out the exact candidate workflow SHA,
# revalidates fresh main/source authority for every CI-eligible version, reruns strict
# repository admission for v1.1.1+ in the same run block as tag mutation, and
# repeats both the live authority and a newly collected complete snapshot
# immediately before every Release create/upload mutation. Eligible historical
# versions retain only the live-authority check; v1.1.0 is manual-only evidence,
# is rejected by CI candidate/promotion policy, and requires a new version if
# incomplete. The job creates one annotated tag and
# publishes the already verified, manifest-bound closed asset set. v1.1.1+
# requires REST immutable=true plus exact uploaded asset names/sizes/digests,
# then independently downloads and hashes every asset. A separate read-only,
# token-free execution step smokes the published
# package. A failed promotion is recovered only by rerunning the failed job in
# that same run.
