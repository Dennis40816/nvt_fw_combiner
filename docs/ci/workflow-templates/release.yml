# Reviewed security-policy template. The executable source is
# .github/workflows/release.yml and is covered by repository workflow tests.
name: release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact current protected-main head (40-character lowercase SHA)
        required: true
        type: string
      pull_request:
        description: Final reviewed pull request merged as that main commit
        required: true
        type: string
      dry_run:
        description: Build a non-promotable candidate without tag or Release authority
        required: true
        default: false
        type: boolean

permissions:
  contents: read

# The candidate, pre-tag and pre-Release boundaries collect fresh repository
# admission through the read-only Python policy. The source is always current
# protected main. First publication requires an absent tag and a version above
# every stable tag, checked at candidate and immediately before tag mutation.
# The candidate uses .github/actions/setup-toolchain, shared with the manual
# release rehearsal; that rehearsal has no promotion authority.
# Same-run recovery validates an exact existing tag instead. A dry run labels
# its manifest nonPromotable, prefixes its artifact, and skips promotion.
# The release-eligibility job requires terminal parity success for every
# version from 2.0.0; it fails a required skipped, failed or cancelled gate.
# The protected release environment unlocks the only contents:write job.
# That job runs only protected-main policy, checks live authority before each
# mutation, and verifies immutable Release metadata and downloaded assets.
# A separate token-free execution step smokes the published package.
