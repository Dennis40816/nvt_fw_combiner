name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: policy / polytail
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require PR head to contain the exact reviewed base
        if: github.event_name == 'pull_request'
        env:
          NFC_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NFC_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: pwsh
        run: |
          $actualHead = & git rev-parse --verify HEAD
          $revParseStatus = $LASTEXITCODE
          if ($revParseStatus -ne 0) {
            throw "Unable to resolve the checked-out HEAD."
          }
          $actualHead = $actualHead.Trim()
          if ($actualHead -cne $env:NFC_PR_HEAD_SHA) {
            throw "The checked-out HEAD does not match the pull-request head."
          }
          & git merge-base --is-ancestor $env:NFC_PR_BASE_SHA HEAD
          $ancestryStatus = $LASTEXITCODE
          if ($ancestryStatus -ne 0) {
            throw "The pull-request head does not contain the exact reviewed base."
          }
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install repository verification dependency
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
      - name: Validate structure, policy, contracts, and provenance
        run: python scripts/verify.py --structure-only

  python-worker:
    name: python-worker / verify
    needs: [repository-scripts]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Require every repository-script shard to succeed
        shell: pwsh
        env:
          NFC_REPOSITORY_SCRIPTS_RESULT: ${{ needs.repository-scripts.result }}
        run: |
          if ($env:NFC_REPOSITORY_SCRIPTS_RESULT -cne 'success') {
            throw 'Repository-script verification did not complete successfully.'
          }
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install worker verification dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev]'
      - name: Verify worker
        run: python scripts/verify.py --ci-python-shard python
      - name: Upload Python coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-coverage
          path: artifacts/coverage/python/
          if-no-files-found: ignore
          retention-days: 3

  repository-scripts:
    name: python / repository policy (${{ matrix.shard }})
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [repository-scripts-a-q, repository-scripts-r, repository-scripts-s-z]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install repository verification dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev]'
      - name: Verify repository-script shard
        run: python scripts/verify.py --ci-python-shard ${{ matrix.shard }}

  dotnet-build:
    name: dotnet / build
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install repository verification dependency
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
      - name: Add resolved .NET to PATH
        shell: pwsh
        run: |
          $repoDotnet = "${{ github.workspace }}\.dotnet\dotnet.exe"
          if (Test-Path -LiteralPath $repoDotnet -PathType Leaf) {
            $dotnetRoot = Split-Path -Parent $repoDotnet
          } else {
            $dotnetRoot = Split-Path -Parent (Get-Command dotnet -ErrorAction Stop).Source
          }
          $dotnetRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $dotnetRoot 'dotnet.exe') --version
      - name: Produce canonical Release-build evidence
        shell: pwsh
        env:
          NFC_DOTNET_BUILD_LOG: ${{ runner.temp }}/dotnet-build.log
        run: python scripts/verify.py --ci-dotnet-build
      - name: Upload dotnet build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-build-evidence
          path: artifacts/ci-dotnet-upload/
          if-no-files-found: error
          retention-days: 3
      - name: Upload dotnet build log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-build-log
          path: ${{ runner.temp }}/dotnet-build.log
          if-no-files-found: ignore
          retention-days: 3

  dotnet-test:
    name: dotnet / test (${{ matrix.shard }})
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [bootstrap, ui, core]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Add resolved .NET to PATH
        shell: pwsh
        run: |
          $repoDotnet = "${{ github.workspace }}\.dotnet\dotnet.exe"
          if (Test-Path -LiteralPath $repoDotnet -PathType Leaf) {
            $dotnetRoot = Split-Path -Parent $repoDotnet
          } else {
            $dotnetRoot = Split-Path -Parent (Get-Command dotnet -ErrorAction Stop).Source
          }
          $dotnetRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $dotnetRoot 'dotnet.exe') --version
      - name: Produce canonical test evidence
        shell: pwsh
        run: python scripts/verify.py --ci-dotnet-test-shard ${{ matrix.shard }}
      - name: Upload dotnet test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-test-${{ matrix.shard }}-evidence
          path: artifacts/ci-dotnet-upload/
          if-no-files-found: error
          retention-days: 3

  dotnet:
    name: dotnet / build-test
    needs: [dotnet-build, dotnet-test]
    if: >-
      always() &&
      (github.event_name == 'push' || github.event.pull_request.draft == false)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Download dotnet producer evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dotnet-*-evidence
          path: artifacts/ci-dotnet-downloads/
      - name: Validate and aggregate canonical .NET evidence
        env:
          NFC_CI_DOTNET_BUILD_RESULT: ${{ needs.dotnet-build.result }}
          NFC_CI_DOTNET_TEST_RESULT: ${{ needs.dotnet-test.result }}
        run: python scripts/verify.py --ci-dotnet-finalize artifacts/ci-dotnet-downloads
      - name: Upload dotnet coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-coverage
          path: artifacts/coverage/dotnet/
          if-no-files-found: ignore
          retention-days: 3
