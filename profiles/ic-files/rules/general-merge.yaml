# NFC 1.3.0 g.1 IC source. No firmware execution or byte-parity claim.
# Plans are complete named rule declarations; IC variants return layout names only.
schema-version: 1
ic-refs: ["NT51917", "NT51919", "NT51923", "NT51925", "NT51926", "NT51927", "NT51928", "NT51929", "NT51932", "NT51950", "NT51951"]
rule: "general-merge"
naming:
  -
    template: "{ic}-general-merge.bin"
    locked: false
    tokens:
      -
        id: "ic"
        fact: "compiled-ic"
        formatter: "lowercase"
        missing: "reject"
    id: "logical-output"
plans:
  -
    id: "general-merge-for-logical-output"
    kind: "general-merge"
    uses-inputs: ["source"]
    initial:
      kind: "blank"
      fill: "0x0"
      length:
        extent: "output"
    settings:
      -
        id: "requested-output-length"
        type: "hex-length"
        min-length: "0x1"
        max-length: "0x7FFFFFFF"
    user-mappings:
      -
        input: "source"
        root: "output-image"
        overlap: "reject"
        length-policy: "exact"
        on-protected: "warn"
    option-defaults: []
    pre: []
    steps: []
    post: []
