        from:
          space: "tp-input"
          region: "slice-pre-check-non-uniform-tp-input-from-tp-input"
        diagnostic: "TP_UNIFORM_CONTENT_WARNING"
    steps:
      -
        kind: "copy"
        id: "copy-dp-container"
        overlap: "reject"
        from:
          space: "dp-input"
          region: "dp-container"
        to:
          space: "output-image"
          region: "dp-container"
      -
        kind: "copy"
        id: "overlay-tp"
        overlap: "replace-existing"
        from:
          space: "tp-input"
          region: "slice-steps-overlay-tp-from-tp-input"
        to:
          space: "output-image"
          region: "slice-steps-overlay-tp-to-output-image"
    post:
      -
        kind: "integrity"
        when:
          fact: "setting.vendor-footer"
          kind: "equals"
          equals: true
        run: "vendor-footer-for-nt51951-ab-desay-1024k"
