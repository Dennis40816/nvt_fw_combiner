# NFC 1.3.0 g.1 IC source. No firmware execution or byte-parity claim.
# Plans are complete named rule declarations; IC variants return layout names only.
schema-version: 1
ic-refs: ["NT51950", "NT51951"]
rule: "ab-replace.nt51950-and-nt51951"
naming:
  -
    template: "nt51950-ctrlram-replace.bin"
    locked: false
    tokens: []
    id: "nt51950-ctrlram-replace-fw1x-cascade"
  -
    template: "nt51951-ctrlram-replace.bin"
    locked: false
    tokens: []
    id: "nt51951-ctrlram-replace-fw1x-cascade"
plans:
  -
    id: "ab-replace-for-nt51950-ab-merge-512k-ab-replace-banks-b-and-both"
    kind: "ctrlram-replace"
    uses-inputs: ["reference-base", "ctrlram-source"]
    initial:
      kind: "clone"
      input: "reference-base"
      length:
        extent: "output"
    settings:
      -
        id: "banks"
        type: "choice"
        default: "both"
        values: ["a", "b", "both"]
    user-mappings: []
    option-defaults: []
    pre:
      -
        kind: "initialize"
        to: "ab-combiner-work"
        initial:
          kind: "blank"
          fill: "0x0"
          length:
            extent: "ab-combiner-work-length"
    steps: []
    post:
      -
        kind: "copy"
        id: "import-postbuild-b-ilm"
        overlap: "replace-existing"
        from:
          space: "ab-combiner-work"
          region: "slice-post-import-postbuild-b-ilm-from-ab-combiner-work"
        to:
          space: "output-image"
          region: "slice-post-import-postbuild-b-ilm-to-output-image"
      -
        kind: "copy"
        id: "import-postbuild-b-dlm"
        overlap: "replace-existing"
        from:
          space: "ab-combiner-work"
          region: "slice-post-import-postbuild-b-dlm-from-ab-combiner-work"
        to:
          space: "output-image"
          region: "slice-post-import-postbuild-b-dlm-to-output-image"
      -
        kind: "copy"
        id: "import-postbuild-b-crc"
        overlap: "replace-existing"
        from:
          space: "ab-combiner-work"
          region: "slice-post-import-postbuild-b-crc-from-ab-combiner-work"
        to:
          space: "output-image"
          region: "slice-post-import-postbuild-b-crc-to-output-image"
  -
    id: "ab-replace-for-nt51950-ab-merge-512k-ab-replace-banks-a"
    kind: "ctrlram-replace"
    uses-inputs: ["reference-base", "ctrlram-source"]
    initial:
      kind: "clone"
      input: "reference-base"
      length:
        extent: "output"
    settings:
      -
        id: "banks"
        type: "choice"
        default: "both"
        values: ["a", "b", "both"]
    user-mappings: []
    option-defaults: []
    pre:
      -
        kind: "initialize"
        to: "ab-combiner-work"
        initial:
          kind: "blank"
          fill: "0x0"
          length:
            extent: "ab-combiner-work-length"
    steps: []
    post: []
