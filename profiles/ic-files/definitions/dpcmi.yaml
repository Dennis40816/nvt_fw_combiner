# NFC 1.3.0 g.1 IC source. No firmware execution or byte-parity claim.
# Local $self space is rebound to the located field id; no IC addresses are stored here.
schema-version: 1
definition: "dpcmi"
kind: "structure"
fields:
  -
    kind: "scalar"
    id: "jira-low"
    at:
      space: "$self"
      start: "0x0"
      end: "0x1"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "dp-major"
    at:
      space: "$self"
      start: "0x1"
      end: "0x2"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "dp-minor"
    at:
      space: "$self"
      start: "0x2"
      end: "0x3"
    decoder: "u8le"
    required: false
    bits:
      -
        bit-offset: 4
        bit-length: 4
  -
    kind: "scalar"
    id: "jira-high"
    at:
      space: "$self"
      start: "0x2"
      end: "0x3"
    decoder: "u8le"
    required: false
    bits:
      -
        bit-offset: 0
        bit-length: 4
