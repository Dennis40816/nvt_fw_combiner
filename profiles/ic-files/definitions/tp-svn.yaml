# NFC 1.3.0 g.1 IC source. No firmware execution or byte-parity claim.
# Local $self space is rebound to the located field id; no IC addresses are stored here.
schema-version: 1
definition: "tp-svn"
kind: "structure"
fields:
  -
    kind: "scalar"
    id: "svn-flags"
    at:
      space: "$self"
      start: "0x0"
      end: "0x1"
    decoder: "bytes"
    required: false
  -
    kind: "scalar"
    id: "svn-revision"
    at:
      space: "$self"
      start: "0x1"
      end: "0x4"
    decoder: "bytes"
    required: false
