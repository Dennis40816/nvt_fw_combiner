    kind: "scalar"
    id: "tp-firmware-version"
    at:
      space: "$self"
      start: "0x0"
      end: "0x1"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "tp-firmware-version-complement"
