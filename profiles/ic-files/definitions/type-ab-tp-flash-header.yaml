    id: "complete-header"
    at:
      space: "$self"
      start: "0x0"
      end: "0x100"
  -
    id: "descriptor-table"
    at:
      space: "$self"
      start: "0x0"
      end: "0x44"
  -
    id: "bank-relative-start-addresses"
    at:
      space: "$self"
      start: "0x64"
      end: "0x70"
