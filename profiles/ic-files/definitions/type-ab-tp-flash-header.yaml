          fact: "ic-count"
          kind: "equals"
          equals: 6
        indices: [0, 1, 2, 3, 4, 5]
      -
        when:
          fact: "ic-count"
          kind: "equals"
          equals: 7
        indices: [0, 1, 2, 3, 4, 5, 6]
      -
        when:
          fact: "ic-count"
          kind: "equals"
          equals: 8
