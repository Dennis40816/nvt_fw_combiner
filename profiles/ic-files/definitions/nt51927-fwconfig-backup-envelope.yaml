# NFC 1.3.0 g.1 IC source. No firmware execution or byte-parity claim.
# Local $self space is rebound to the located field id; no IC addresses are stored here.
schema-version: 1
definition: "nt51927-fwconfig-backup-envelope"
kind: "structure"
fields:
  -
    kind: "scalar"
    id: "chip-count"
    at:
      space: "$self"
      start: "0x17"
      end: "0x18"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "common-fw-major"
    at:
      space: "$self"
      start: "0x1A"
      end: "0x1B"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "common-fw-minor"
    at:
      space: "$self"
      start: "0x1B"
      end: "0x1C"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "common-fw-additional"
    at:
      space: "$self"
      start: "0x1C"
      end: "0x1D"
    decoder: "u8le"
    required: false
  -
    kind: "scalar"
    id: "project-id"
    at:
      space: "$self"
      start: "0x22"
      end: "0x24"
    decoder: "u16le"
    required: false
asserts:
  -
    at:
      space: "$self"
      start: "0xFFC"
      end: "0x1000"
    equals: "004e5654"
