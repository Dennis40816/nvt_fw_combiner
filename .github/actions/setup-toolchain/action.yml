name: Setup release toolchain
description: Install the pinned Python and repository .NET SDK with worker packaging dependencies
inputs:
  worker-extras:
    description: Closed worker extra set for this release build
    required: true
runs:
  using: composite
  steps:
    - name: Setup pinned Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: tools/crc-worker/pyproject.toml
    - name: Install pinned repository .NET SDK
      shell: pwsh
      run: ./scripts/install-dotnet.ps1 -Scope Repository
    - name: Add repository .NET to PATH
      shell: pwsh
      run: |
        "$env:GITHUB_WORKSPACE\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "DOTNET_ROOT=$env:GITHUB_WORKSPACE\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    - name: Install worker verification and packaging dependencies
      shell: pwsh
      env:
        NFC_WORKER_EXTRAS: ${{ inputs.worker-extras }}
      run: |
        if ($env:NFC_WORKER_EXTRAS -notin @('dev', 'dev,package')) {
          throw 'Unsupported worker extras for the release toolchain.'
        }
        python -m pip install --disable-pip-version-check -e "./tools/crc-worker[$env:NFC_WORKER_EXTRAS]"
        if ($LASTEXITCODE -ne 0) { throw 'Worker dependency installation failed.' }
