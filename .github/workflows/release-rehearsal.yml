name: release-rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: rehearsal / stable win-x64 package
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout selected branch head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup release toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          worker-extras: dev,package
      - name: Identify rehearsal source and synthetic publication time
        id: identity
        shell: pwsh
        run: |
          $sourceSha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $sourceSha -ne '${{ github.sha }}') {
            throw 'Rehearsal checkout is not the selected branch head.'
          }
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Rehearsal VERSION must be stable SemVer.'
          }
          $publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source-sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "published-at=$publishedAt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "NFC_UPDATE_CATALOG_TOOL=./scripts/create_update_catalog.py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NFC_UPDATE_SOURCE_REGISTRY_TEMPLATE=./docs/ci/update-source-registry.json.in" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Build rehearsal only: no release admission, approval, promotion, tag, or GitHub Release was exercised. The handoff timestamp is synthetic." >> $env:GITHUB_STEP_SUMMARY
      - name: Verify release source and owner-certified Golden outputs
        shell: pwsh
        run: |
          python ./scripts/verify.py --release-golden
          if ($LASTEXITCODE -ne 0) { throw 'Rehearsal source verification failed.' }
      - name: Build stable release package with managed Launcher
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
        run: ./scripts/package.ps1 -Version $env:NFC_VERSION -Commit $env:NFC_SOURCE_SHA
      - name: Smoke stable package
        shell: pwsh
        env:
          NFC_TAG: ${{ steps.identity.outputs.tag }}
        run: ./scripts/smoke-release.ps1 -PackagePath "./artifacts/release/NvtFwCombiner-$env:NFC_TAG-win-x64.zip" -SkipUiLaunch
      - name: Render complete release notes from CHANGELOG
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
        run: python ./scripts/render_release_notes.py --version $env:NFC_VERSION --output ./artifacts/release/RELEASE-NOTES.md
      - name: Create rehearsal update-source handoff
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_TAG: ${{ steps.identity.outputs.tag }}
          NFC_PUBLISHED_AT: ${{ steps.identity.outputs.published-at }}
        run: |
          $handoffRoot = Join-Path (Get-Location).Path 'artifacts/update-source-handoff'
          $packagesRoot = Join-Path $handoffRoot 'packages'
          if (Test-Path -LiteralPath $handoffRoot) {
            throw 'Update-source handoff directory must not already exist.'
          }
          New-Item -ItemType Directory -Path $packagesRoot | Out-Null

          $packageName = "NvtFwCombiner-$env:NFC_TAG-win-x64.zip"
          $packageSource = (Resolve-Path -LiteralPath (Join-Path './artifacts/release' $packageName)).Path
          $packageDestination = Join-Path $packagesRoot $packageName
          Copy-Item -LiteralPath $packageSource -Destination $packageDestination

          $notesPath = (Resolve-Path -LiteralPath './artifacts/release/RELEASE-NOTES.md').Path
          $publishedAssignment = '{0}={1}' -f $env:NFC_VERSION, $env:NFC_PUBLISHED_AT
          $notesAssignment = '{0}={1}' -f $env:NFC_VERSION, $notesPath
          $manifestPath = Join-Path $handoffRoot 'RELEASE-MANIFEST.json'
          $manifestAssignment = '{0}={1}' -f $env:NFC_VERSION, $manifestPath
          $registryPath = Join-Path $handoffRoot 'update-source-registry.json'
          $catalogArguments = @(
            $env:NFC_UPDATE_CATALOG_TOOL
            '--source-root'
            $handoffRoot
            '--published-at'
            $publishedAssignment
            '--release-notes-file'
            $notesAssignment
            '--manifest-copy'
            $manifestAssignment
            '--registry-template'
            $env:NFC_UPDATE_SOURCE_REGISTRY_TEMPLATE
            '--registry-output'
            $registryPath
            '--registry-revision'
            $env:GITHUB_RUN_ID
            '--registry-published-at'
            $env:NFC_PUBLISHED_AT
          )
          & python @catalogArguments
          if ($LASTEXITCODE -ne 0) { throw 'Rehearsal handoff catalog generation failed.' }
          foreach ($path in @($manifestPath, $registryPath, (Join-Path $handoffRoot 'update-catalog.v1.json'))) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Rehearsal handoff output was not produced: $path"
            }
          }
          $catalog = Get-Content -LiteralPath (Join-Path $handoffRoot 'update-catalog.v1.json') -Raw | ConvertFrom-Json
          if ($catalog.schemaVersion -ne 1 -or $catalog.versions.Count -lt 1 -or
              $catalog.versions[0].version -ne $env:NFC_VERSION) {
            throw 'Rehearsal Catalog identity does not match the package.'
          }
      - name: Upload rehearsal package and notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-package-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload rehearsal update-source handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rehearsal-handoff-${{ github.run_id }}-${{ github.sha }}
          path: artifacts/update-source-handoff/*
          if-no-files-found: error
          retention-days: 3
