name: debug-archive

# Builds the encrypted debug archive that ships with each stable release from
# 1.2.2. The archive holds the pinned test data and the files removed from the
# public tree. It is a 7z with AES-256 content and header encryption. Only the
# release owner holds the password.
#
# The release workflow does not run this file, and this file attaches nothing to a
# release. A later change lets the release promotion job fetch the artifact of the
# successful run for the exact release source and upload it in the same
# `gh release create` call, because a published immutable Release cannot gain
# assets afterwards.
#
# `workflow_run` builds the archive for a release pull request merge only.
# `workflow_dispatch` is a rehearsal: it builds an archive of the current main,
# at any version, and keeps it under another artifact name that no release reads.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-archive
  cancel-in-progress: false

jobs:
  gate:
    name: debug-archive / gate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha && github.sha == github.workflow_sha)) }}
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.request.outputs.eligible }}
      rehearsal: ${{ steps.request.outputs.rehearsal }}
      version: ${{ steps.request.outputs.version }}
      source-sha: ${{ steps.request.outputs.source-sha }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Python for release policy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Derive archive request from merge commit
        id: request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_SOURCE_SHA: ${{ github.workflow_sha }}
          NFC_EVENT: ${{ github.event_name }}
        run: |
          $mainSha = (git rev-parse HEAD).Trim()
          if ($mainSha -cne $env:NFC_SOURCE_SHA) {
            throw 'The workflow definition must be the current protected main SHA.'
          }
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "VERSION must be stable SemVer; found '$version'."
          }
          if ($env:NFC_EVENT -eq 'workflow_dispatch') {
            'eligible=true', 'rehearsal=true', "version=$version", "source-sha=$mainSha" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'Rehearsal: the archive is not a release asset.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }
          if ([version]$version -lt [version]'1.2.2') {
            'eligible=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'Version below 1.2.2: the release carries no debug archive.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }
          $requestText = python ./scripts/release_promotion_policy.py collect-release-request `
            --repository $env:NFC_REPOSITORY --source-sha $mainSha `
            --version $version --automatic
          if ($LASTEXITCODE -ne 0) { throw 'Release request could not be derived.' }
          $request = $requestText | ConvertFrom-Json -ErrorAction Stop
          if ($request.eligible -ne $true) {
            'eligible=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'Ordinary main push: no release pull request for this VERSION.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }
          'eligible=true', 'rehearsal=false', "version=$version", "source-sha=$mainSha" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  pack:
    name: debug-archive / pack
    needs:
      - gate
    if: ${{ needs.gate.outputs.eligible == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: debug-archive
    permissions:
      contents: read
    steps:
      - name: Checkout protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Setup pinned Python for pin verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Pack and self-check the encrypted archive
        id: pack
        shell: pwsh
        env:
          NFC_VERSION: ${{ needs.gate.outputs.version }}
          NFC_SOURCE_SHA: ${{ needs.gate.outputs.source-sha }}
          NFC_REHEARSAL: ${{ needs.gate.outputs.rehearsal }}
          NFC_DEBUG_ARCHIVE_PASSWORD: ${{ secrets.NFC_DEBUG_ARCHIVE_PASSWORD }}
          TESTDATA_DEPLOY_KEY: ${{ secrets.TESTDATA_DEPLOY_KEY }}
          PRIVATE_ASSETS_DEPLOY_KEY: ${{ secrets.PRIVATE_ASSETS_DEPLOY_KEY }}
        run: |
          # The log carries counts and one archive SHA-256. It never carries a
          # file name, a path inside the archive or a command output.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          foreach ($name in 'NFC_DEBUG_ARCHIVE_PASSWORD', 'TESTDATA_DEPLOY_KEY', 'PRIVATE_ASSETS_DEPLOY_KEY') {
            if ([string]::IsNullOrEmpty([Environment]::GetEnvironmentVariable($name))) {
              throw 'debug-archive: The debug archive secrets are incomplete.'
            }
          }
          $password = $env:NFC_DEBUG_ARCHIVE_PASSWORD
          if ($password.Length -lt 24 -or $password -match '["\r\n]') {
            throw 'debug-archive: The debug archive password does not meet the rules.'
          }
          if ((git rev-parse HEAD).Trim() -cne $env:NFC_SOURCE_SHA) {
            throw 'debug-archive: The checked-out commit differs from the release source.'
          }
          $sevenZip = (Get-Command 7z -ErrorAction Stop).Source
          $archiveName = "NvtFwCombiner-v$($env:NFC_VERSION)-debug.7z"
          $artifactName = if ($env:NFC_REHEARSAL -eq 'true') {
            "debug-archive-rehearsal-$($env:GITHUB_RUN_ID)"
          } else {
            "debug-archive-v$($env:NFC_VERSION)-$($env:NFC_SOURCE_SHA)"
          }
          $work = Join-Path $env:RUNNER_TEMP 'debug-archive-work'
          $stage = Join-Path $work 'stage'
          $verify = Join-Path $work 'verify'
          $out = Join-Path $env:RUNNER_TEMP 'debug-archive-out'
          $testdataKey = Join-Path $work 'testdata-key'
          $privateKey = Join-Path $work 'private-key'
          $testdataClone = Join-Path $work 'testdata-clone'
          $privateClone = Join-Path $work 'private-clone'

          function Write-DeployKey([string]$Value, [string]$Path) {
            $text = ($Value -replace "`r`n", "`n").TrimEnd("`n") + "`n"
            [IO.File]::WriteAllText($Path, $text, [Text.UTF8Encoding]::new($false))
            $null = & icacls.exe $Path /inheritance:r /grant:r "$($env:USERNAME):(F)" *>&1
            if ($LASTEXITCODE -ne 0) { throw 'debug-archive: The deploy key file permissions could not be restricted.' }
          }
          function Invoke-QuietGit([string[]]$Arguments) {
            $null = & git @Arguments 2>&1
            if ($LASTEXITCODE -ne 0) { throw 'debug-archive: A private repository operation failed.' }
          }
          function Copy-SparseCommit([string]$Repository, [string]$KeyFile, [string]$Commit, [string]$SparsePath, [string]$Destination) {
            $env:GIT_TERMINAL_PROMPT = '0'
            $env:GIT_SSH_COMMAND = 'ssh -i "' + $KeyFile + '" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes'
            Invoke-QuietGit @('clone', '--filter=blob:none', '--no-checkout', '--sparse', "git@github.com:$Repository.git", $Destination)
            Invoke-QuietGit @('-C', $Destination, 'sparse-checkout', 'set', '--no-cone', "/$SparsePath/")
            if ($Commit) {
              Invoke-QuietGit @('-C', $Destination, 'fetch', '--depth=1', 'origin', $Commit)
            } else {
              $Commit = (& git -C $Destination rev-parse 'origin/HEAD' 2>$null).Trim()
              if ($LASTEXITCODE -ne 0 -or $Commit -cnotmatch '^[0-9a-f]{40}$') { throw 'debug-archive: A private repository operation failed.' }
            }
            Invoke-QuietGit @('-C', $Destination, 'checkout', '--detach', $Commit)
            $actual = (& git -C $Destination rev-parse HEAD 2>$null).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $Commit) { throw 'debug-archive: A private repository operation failed.' }
            return $actual
          }
          function Get-RelativeFiles([string]$Root) {
            $prefix = (Resolve-Path -LiteralPath $Root).Path.TrimEnd('\') + '\'
            @(Get-ChildItem -LiteralPath $Root -Recurse -File -Force | ForEach-Object {
              [pscustomobject]@{ Path = $_.FullName.Substring($prefix.Length).Replace('\', '/'); Full = $_.FullName }
            })
          }
          function Invoke-SevenZip([string[]]$Arguments) {
            $null = & $sevenZip @Arguments *>&1
            return $LASTEXITCODE
          }

          $failed = $false
          try {
            New-Item -ItemType Directory -Force -Path $work, $stage, $out | Out-Null
            Write-DeployKey $env:TESTDATA_DEPLOY_KEY $testdataKey
            Write-DeployKey $env:PRIVATE_ASSETS_DEPLOY_KEY $privateKey

            # 1. Pinned test data, bound to the tree hash of the checked-out baseline.
            if (-not (Test-Path -LiteralPath ./scripts/ci/test-baseline.json -PathType Leaf)) {
              throw 'debug-archive: The test data pin file is missing in this checkout.'
            }
            $pin = (Get-Content -LiteralPath ./scripts/ci/test-baseline.json -Raw | ConvertFrom-Json).pin
            if ($pin.assetsRepo -cne 'Dennis40816/nvt-testdata' -or $pin.assetsPath -cne 'nfc' -or
                $pin.assetsCommit -cnotmatch '^[0-9a-f]{40}$' -or $pin.assetsCommit -ceq ('0' * 40)) {
              throw 'debug-archive: The test data pin is invalid.'
            }
            $testdataCommit = Copy-SparseCommit $pin.assetsRepo $testdataKey $pin.assetsCommit $pin.assetsPath $testdataClone
            $null = & python ./scripts/golden/golden_pin.py verify --root (Join-Path $testdataClone $pin.assetsPath) --baseline ./scripts/ci/test-baseline.json *>&1
            if ($LASTEXITCODE -ne 0) { throw 'debug-archive: The test data does not match its pin.' }
            $testdataStage = Join-Path $stage 'testdata'
            New-Item -ItemType Directory -Force -Path $testdataStage | Out-Null
            Copy-Item -Path (Join-Path (Join-Path $testdataClone $pin.assetsPath) '*') -Destination $testdataStage -Recurse -Force
            $testdataCount = (Get-RelativeFiles $testdataStage).Count

            # 2. Files removed from the public tree, checked against their own SHA-256 list.
            $privateCommit = Copy-SparseCommit 'Dennis40816/nvt-private-assets' $privateKey '' 'nfc/debug-archive/purged' $privateClone
            $purgedRoot = Join-Path $privateClone 'nfc/debug-archive/purged'
            $sumsPath = Join-Path $purgedRoot 'SHA256SUMS'
            if (-not (Test-Path -LiteralPath $sumsPath -PathType Leaf)) { throw 'debug-archive: The purged file list is missing.' }
            $listed = @{}
            foreach ($line in Get-Content -LiteralPath $sumsPath) {
              $entry = [regex]::Match($line, '^([0-9a-f]{64})  ([^\\/:][^\\:]*)$')
              if (-not $entry.Success -or [regex]::IsMatch($entry.Groups[2].Value, '(^|/)\.\.?(/|$)')) {
                throw 'debug-archive: The purged file list is malformed.'
              }
              if ($listed.ContainsKey($entry.Groups[2].Value)) { throw 'debug-archive: The purged file list repeats an entry.' }
              $listed[$entry.Groups[2].Value] = $entry.Groups[1].Value
            }
            $present = Get-RelativeFiles $purgedRoot | Where-Object { $_.Path -cne 'SHA256SUMS' }
            if ($present.Count -ne $listed.Count) { throw 'debug-archive: The purged files differ from their list.' }
            foreach ($file in $present) {
              if (-not $listed.ContainsKey($file.Path) -or
                  (Get-FileHash -LiteralPath $file.Full -Algorithm SHA256).Hash.ToLowerInvariant() -cne $listed[$file.Path]) {
                throw 'debug-archive: The purged files differ from their list.'
              }
            }
            $purgedStage = Join-Path $stage 'purged'
            New-Item -ItemType Directory -Force -Path $purgedStage | Out-Null
            Copy-Item -Path (Join-Path $purgedRoot '*') -Destination $purgedStage -Recurse -Force
            $purgedCount = $present.Count

            # 3. Inventory of the staged tree, kept inside the encrypted archive.
            $inventory = @(Get-RelativeFiles $stage | Sort-Object Path | ForEach-Object {
              [ordered]@{
                path = $_.Path
                size = (Get-Item -LiteralPath $_.Full).Length
                sha256 = (Get-FileHash -LiteralPath $_.Full -Algorithm SHA256).Hash.ToLowerInvariant()
              }
            })
            [ordered]@{
              schemaVersion = 1
              tag = "v$($env:NFC_VERSION)"
              sourceSha = $env:NFC_SOURCE_SHA
              testdata = [ordered]@{ repository = $pin.assetsRepo; commit = $testdataCommit; files = $testdataCount }
              privateAssets = [ordered]@{ repository = 'Dennis40816/nvt-private-assets'; commit = $privateCommit; files = $purgedCount }
              fileCount = $inventory.Count
              files = $inventory
            } | ConvertTo-Json -Depth 6 |
              Set-Content -LiteralPath (Join-Path $stage 'SOURCE.json') -Encoding utf8NoBOM

            # 4. Pack with AES-256 content and header encryption.
            $archive = Join-Path $out $archiveName
            Push-Location $stage
            try {
              $status = Invoke-SevenZip @('a', '-t7z', '-mx=9', '-mhe=on', "-p$password", '-bso0', '-bse0', '-bsp0', $archive, 'testdata', 'purged', 'SOURCE.json')
            } finally { Pop-Location }
            if ($status -ne 0) { throw 'debug-archive: Packing the debug archive failed.' }

            # 5. Self-check: integrity, content, and an unreadable header without the password.
            if ((Invoke-SevenZip @('t', "-p$password", '-bso0', '-bse0', '-bsp0', $archive)) -ne 0) {
              throw 'debug-archive: The debug archive failed its integrity test.'
            }
            New-Item -ItemType Directory -Force -Path $verify | Out-Null
            if ((Invoke-SevenZip @('x', "-p$password", "-o$verify", '-y', '-bso0', '-bse0', '-bsp0', $archive)) -ne 0) {
              throw 'debug-archive: The debug archive could not be extracted for the content check.'
            }
            $extracted = @(Get-RelativeFiles $verify | Where-Object { $_.Path -cne 'SOURCE.json' })
            if ($extracted.Count -ne $inventory.Count) { throw 'debug-archive: The debug archive file count differs from its inventory.' }
            $expected = @{}
            foreach ($entry in $inventory) { $expected[$entry.path] = $entry.sha256 }
            foreach ($file in $extracted) {
              if (-not $expected.ContainsKey($file.Path) -or
                  (Get-FileHash -LiteralPath $file.Full -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected[$file.Path]) {
                throw 'debug-archive: The debug archive content differs from its inventory.'
              }
            }
            Remove-Item -LiteralPath $verify -Recurse -Force
            if ((Invoke-SevenZip @('l', '-pwrong-password-for-the-header-check', '-bso0', '-bse0', '-bsp0', $archive)) -eq 0) {
              throw 'debug-archive: The debug archive header is not encrypted.'
            }

            $sha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
            $size = (Get-Item -LiteralPath $archive).Length
            "artifact-name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "archive-path=$($archive.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            @(
              "## Debug archive v$($env:NFC_VERSION)"
              "Source SHA: ``$($env:NFC_SOURCE_SHA)``"
              "Files: $($inventory.Count) ($testdataCount test data, $purgedCount removed from the public tree)"
              "Archive: $size bytes, SHA-256 ``$sha256``"
              "Artifact: ``$artifactName``"
            ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } catch {
            $failed = $true
            $text = [string]$_.Exception.Message
            if ($text.StartsWith('debug-archive: ')) { Write-Host "::error::$text" }
            else { Write-Host '::error::debug-archive: unexpected error; the details are withheld because they can name private files.' }
          } finally {
            Remove-Item Env:GIT_SSH_COMMAND, Env:GIT_TERMINAL_PROMPT -ErrorAction SilentlyContinue
            foreach ($keyFile in $testdataKey, $privateKey) {
              if (Test-Path -LiteralPath $keyFile -PathType Leaf) {
                $null = & icacls.exe $keyFile /grant:r "$($env:USERNAME):F" *>&1
                Remove-Item -LiteralPath $keyFile -Force -ErrorAction SilentlyContinue
              }
            }
            if (Test-Path -LiteralPath $work) { Remove-Item -LiteralPath $work -Recurse -Force -ErrorAction SilentlyContinue }
            if ((Test-Path -LiteralPath $testdataKey) -or (Test-Path -LiteralPath $privateKey) -or (Test-Path -LiteralPath $work)) {
              $failed = $true
              Write-Host '::error::debug-archive: Cleanup left key or work files behind.'
            }
          }
          if ($failed) { exit 1 }
      - name: Upload encrypted debug archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.pack.outputs.artifact-name }}
          path: ${{ steps.pack.outputs.archive-path }}
          if-no-files-found: error
          retention-days: 3
