name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved stable SemVer tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: release / package
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    env:
      NFC_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate stable release tag
        shell: pwsh
        run: |
          if ($env:NFC_RELEASE_TAG -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release requires a stable SemVer tag in vX.Y.Z form.'
          }
      - name: Checkout approved tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.NFC_RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm checked-out commit is exactly tagged
        shell: pwsh
        run: |
          git rev-parse --verify "refs/tags/$env:NFC_RELEASE_TAG"
          if ((git rev-list -n 1 $env:NFC_RELEASE_TAG) -ne (git rev-parse HEAD)) {
            throw 'Checked-out commit does not match the requested tag.'
          }
      - name: Confirm release tag is on main
        shell: pwsh
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag must be reachable from origin/main.'
          }
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0 immutable reviewed commit
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Add repository .NET to PATH
        shell: pwsh
        run: |
          "${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install worker verification and packaging dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev,package]'
      - name: Verify release source
        run: python ./scripts/verify.py --all
      - name: Build closed-allowlist release package
        shell: pwsh
        run: ./scripts/package.ps1 -Version "$env:NFC_RELEASE_TAG" -Commit '${{ github.sha }}'
      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:NFC_RELEASE_TAG" ./artifacts/release/* --verify-tag --generate-notes
