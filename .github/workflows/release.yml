name: release

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate a non-promotable candidate on protected main
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  candidate:
    name: release / candidate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_sha == github.sha && github.sha == github.workflow_sha)) }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    outputs:
      source-sha: ${{ steps.identity.outputs.source-sha }}
      source-tree: ${{ steps.identity.outputs.source-tree }}
      source-branch: ${{ steps.identity.outputs.source-branch }}
      dry-run: ${{ steps.request.outputs.eligible == 'true' && steps.identity.outputs.dry-run || 'true' }}
      workflow-sha: ${{ steps.identity.outputs.workflow-sha }}
      version: ${{ steps.identity.outputs.version }}
      tag: ${{ steps.identity.outputs.tag }}
      pull-request: ${{ steps.request.outputs.pull-request }}
      review-head-sha: ${{ steps.admission.outputs.review-head-sha }}
      artifact-name: ${{ steps.identity.outputs.artifact-name }}
      artifact-digest: ${{ steps.candidate-upload.outputs.artifact-digest }}
      manifest-name: ${{ steps.manifest.outputs.manifest-name }}
      manifest-sha256: ${{ steps.manifest.outputs.manifest-sha256 }}
    steps:
      - name: Checkout protected main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Setup release toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          worker-extras: dev,package
      - name: Derive release request from merge commit
        id: request
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_SOURCE_SHA: ${{ github.workflow_sha }}
          NFC_AUTOMATIC: ${{ github.event_name == 'workflow_run' }}
        run: |
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          $automaticArgument = @(if ($env:NFC_AUTOMATIC -eq 'true') { '--automatic' })
          $requestText = python ./scripts/release_promotion_policy.py collect-release-request `
            --repository $env:NFC_REPOSITORY --source-sha $env:NFC_SOURCE_SHA `
            --version $version --github-output $env:GITHUB_OUTPUT @automaticArgument
          if ($LASTEXITCODE -ne 0) { throw 'Release request could not be derived.' }
          $request = $requestText | ConvertFrom-Json -ErrorAction Stop
          if ($request.eligible -ne $true) {
            'eligible=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'Ordinary main push: no release pull request for this VERSION.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
            return
          }
      - name: Lock release authority and candidate identity
        if: ${{ steps.request.outputs.eligible == 'true' }}
        id: identity
        shell: pwsh
        env:
          NFC_REQUESTED_SHA: ${{ steps.request.outputs.source-sha }}
          NFC_DRY_RUN: ${{ inputs.dry_run || false }}
          NFC_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          $mainSha = git rev-parse HEAD
          if ($mainSha -ne $env:NFC_WORKFLOW_SHA) {
            throw 'The workflow definition must be the current protected main SHA.'
          }
          $sourceSha = $mainSha
          if ($sourceSha -ne $env:NFC_REQUESTED_SHA) {
            throw 'The requested SHA must be the exact current protected main head.'
          }
          if ($env:NFC_DRY_RUN -notin @('true', 'false')) {
            throw 'The dry-run input is invalid.'
          }
          "NFC_RELEASE_POLICY=./scripts/release_promotion_policy.py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NFC_UPDATE_CATALOG_TOOL=./scripts/create_update_catalog.py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NFC_UPDATE_SOURCE_REGISTRY_TEMPLATE=./docs/ci/update-source-registry.json.in" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "VERSION must be stable SemVer; found '$version'."
          }
          $tag = "v$version"
          $sourceTree = git rev-parse 'HEAD^{tree}'
          $artifactPrefix = if ($env:NFC_DRY_RUN -eq 'true') { 'dry-run-candidate' } else { 'stable-candidate' }
          $artifactName = "$artifactPrefix-${{ github.run_id }}-$sourceSha"
          "source-sha=$sourceSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source-tree=$sourceTree" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source-branch=main" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "workflow-sha=$env:NFC_WORKFLOW_SHA" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "dry-run=$env:NFC_DRY_RUN" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "artifact-name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Collect and validate final PR review/check evidence
        if: ${{ steps.request.outputs.eligible == 'true' }}
        id: admission
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_PULL_REQUEST: ${{ steps.request.outputs.pull-request }}
          NFC_PUBLISHED_AT: ${{ steps.request.outputs.published-at }}
          NFC_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          NFC_SOURCE_TREE: ${{ steps.identity.outputs.source-tree }}
          NFC_SOURCE_VERSION: ${{ steps.identity.outputs.version }}
          NFC_WORKFLOW_REF: ${{ github.ref }}
        run: |
          $evidenceRoot = Join-Path '${{ github.workspace }}' 'artifacts/release-evidence'
          New-Item -ItemType Directory -Force -Path $evidenceRoot | Out-Null
          $snapshotPath = Join-Path $evidenceRoot 'review-snapshot.json'
          python $env:NFC_RELEASE_POLICY collect-review-snapshot `
            --repository $env:NFC_REPOSITORY `
            --source-sha $env:NFC_SOURCE_SHA `
            --source-tree $env:NFC_SOURCE_TREE `
            --version $env:NFC_SOURCE_VERSION `
            --pull-request $env:NFC_PULL_REQUEST `
            --published-at $env:NFC_PUBLISHED_AT `
            --workflow-ref $env:NFC_WORKFLOW_REF `
            --output $snapshotPath
          if ($LASTEXITCODE -ne 0) { throw 'Final PR review/tree/check policy failed.' }
          $snapshot = Get-Content -LiteralPath $snapshotPath -Raw | ConvertFrom-Json -ErrorAction Stop
          "review-head-sha=$($snapshot.headSha)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Require readable stable tag and Release state
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $tagState = python $env:NFC_RELEASE_POLICY probe-resource `
            --endpoint "repos/$env:NFC_REPOSITORY/git/ref/tags/$env:NFC_TAG"
          if ($LASTEXITCODE -ne 0 -or $tagState.Trim() -notin @('absent', 'present')) {
            throw "Stable tag '$env:NFC_TAG' state could not be proved."
          }
          $releaseState = python $env:NFC_RELEASE_POLICY probe-resource `
            --endpoint "repos/$env:NFC_REPOSITORY/releases/tags/$env:NFC_TAG"
          if ($LASTEXITCODE -ne 0 -or $releaseState.Trim() -notin @('absent', 'present')) {
            throw "Release '$env:NFC_TAG' state could not be proved."
          }
      - name: Enforce first-publication release floor
        if: ${{ steps.request.outputs.eligible == 'true' && !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          $tagState = python $env:NFC_RELEASE_POLICY probe-resource `
            --endpoint "repos/$env:NFC_REPOSITORY/git/ref/tags/$env:NFC_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate tag state could not be proved.' }
          python $env:NFC_RELEASE_POLICY validate-release-floor `
            --repository $env:NFC_REPOSITORY --version $env:NFC_VERSION `
            --tag-state $tagState.Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Candidate release floor failed.' }
      - name: Label dry-run floor as non-authorizing
        if: ${{ steps.request.outputs.eligible == 'true' && inputs.dry_run }}
        shell: pwsh
        run: '"Dry run: no release-floor eligibility or promotion authority." >> $env:GITHUB_STEP_SUMMARY'
      - name: Verify release source
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          NFC_SOURCE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          python ./scripts/verify.py --release-golden
          if ($LASTEXITCODE -ne 0) { throw 'Release source verification failed.' }
      - name: Build closed-allowlist release package
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
        run: ./scripts/package.ps1 -Version $env:NFC_VERSION -Commit $env:NFC_SOURCE_SHA
      - name: Smoke candidate package
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          NFC_TAG: ${{ steps.identity.outputs.tag }}
        run: ./scripts/smoke-release.ps1 -PackagePath "./artifacts/release/NvtFwCombiner-$env:NFC_TAG-win-x64.zip" -SkipUiLaunch
      - name: Render complete release notes from CHANGELOG
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_PUBLISHED_AT: ${{ steps.request.outputs.published-at }}
        run: |
          $notesPath = './artifacts/release/RELEASE-NOTES.md'
          python ./scripts/render_release_notes.py --version $env:NFC_VERSION --output $notesPath
          if ($LASTEXITCODE -ne 0) { throw 'Release notes rendering failed.' }
          Add-Content -LiteralPath $notesPath -Encoding utf8NoBOM -Value "`nCatalog publishedAt: $env:NFC_PUBLISHED_AT (release PR merge time; not actual publication time)."
      - name: Create single-version update-source handoff
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_TAG: ${{ steps.identity.outputs.tag }}
          NFC_PUBLISHED_AT: ${{ steps.request.outputs.published-at }}
        run: |
          $handoffRoot = Join-Path (Get-Location).Path 'artifacts/update-source-handoff'
          $packagesRoot = Join-Path $handoffRoot 'packages'
          if (Test-Path -LiteralPath $handoffRoot) {
            throw 'Update-source handoff directory must not already exist.'
          }
          New-Item -ItemType Directory -Path $packagesRoot | Out-Null

          $packageName = "NvtFwCombiner-$env:NFC_TAG-win-x64.zip"
          $packageSource = (Resolve-Path -LiteralPath (Join-Path './artifacts/release' $packageName)).Path
          $packageDestination = Join-Path $packagesRoot $packageName
          Copy-Item -LiteralPath $packageSource -Destination $packageDestination

          $notesPath = (Resolve-Path -LiteralPath './artifacts/release/RELEASE-NOTES.md').Path
          $publishedAssignment = '{0}={1}' -f $env:NFC_VERSION, $env:NFC_PUBLISHED_AT
          $notesAssignment = '{0}={1}' -f $env:NFC_VERSION, $notesPath
          $manifestPath = Join-Path $handoffRoot 'RELEASE-MANIFEST.json'
          $manifestAssignment = '{0}={1}' -f $env:NFC_VERSION, $manifestPath
          $registryPath = Join-Path $handoffRoot 'update-source-registry.json'
          $catalogArguments = @(
            $env:NFC_UPDATE_CATALOG_TOOL
            '--source-root'
            $handoffRoot
            '--published-at'
            $publishedAssignment
            '--release-notes-file'
            $notesAssignment
            '--manifest-copy'
            $manifestAssignment
            '--registry-template'
            $env:NFC_UPDATE_SOURCE_REGISTRY_TEMPLATE
            '--registry-output'
            $registryPath
            '--registry-revision'
            $env:GITHUB_RUN_ID
            '--registry-published-at'
            $env:NFC_PUBLISHED_AT
          )
          & python @catalogArguments
          if ($LASTEXITCODE -ne 0) {
            throw 'Update-source handoff catalog generation failed.'
          }

          $catalogPath = Join-Path $handoffRoot 'update-catalog.v1.json'
          if (-not (Test-Path -LiteralPath $catalogPath -PathType Leaf)) {
            throw 'Update-source handoff catalog was not produced.'
          }
          if (-not (Test-Path -LiteralPath $manifestPath -PathType Leaf)) {
            throw 'Update-source handoff release manifest was not produced.'
          }
          if (-not (Test-Path -LiteralPath $registryPath -PathType Leaf)) {
            throw 'Update-source handoff Registry was not rendered.'
          }
          $catalog = Get-Content -LiteralPath $catalogPath -Raw | ConvertFrom-Json
          if ($catalog.schemaVersion -ne 1 -or $catalog.versions.Count -lt 1 -or
              $catalog.versions[0].version -ne $env:NFC_VERSION) {
            throw 'Generated Catalog identity does not match the release.'
          }
      - name: Create closed candidate manifest and outer checksums
        if: ${{ steps.request.outputs.eligible == 'true' }}
        id: manifest
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          NFC_SOURCE_TREE: ${{ steps.identity.outputs.source-tree }}
          NFC_WORKFLOW_SHA: ${{ github.workflow_sha }}
          NFC_WORKFLOW_REF: ${{ github.ref }}
          NFC_RUN_ID: ${{ github.run_id }}
          NFC_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          $dryRunArgument = @(if ($env:NFC_DRY_RUN -eq 'true') { '--dry-run' })
          $manifestPath = python $env:NFC_RELEASE_POLICY create-manifest `
            --asset-dir ./artifacts/release `
            --version $env:NFC_VERSION `
            --source-sha $env:NFC_SOURCE_SHA `
            --source-tree $env:NFC_SOURCE_TREE `
            --run-id $env:NFC_RUN_ID `
            --workflow-sha $env:NFC_WORKFLOW_SHA `
            --workflow-ref $env:NFC_WORKFLOW_REF `
            --notes ./artifacts/release/RELEASE-NOTES.md `
            --review-snapshot ./artifacts/release-evidence/review-snapshot.json `
            @dryRunArgument
          if ($LASTEXITCODE -ne 0) { throw 'Candidate manifest generation failed.' }
          $manifestPath = $manifestPath.Trim()
          "manifest-name=$([IO.Path]::GetFileName($manifestPath))" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "manifest-sha256=$((Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Upload immutable candidate assets
        if: ${{ steps.request.outputs.eligible == 'true' }}
        id: candidate-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.identity.outputs.artifact-name }}
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
      - name: Upload update-source handoff
        if: ${{ steps.request.outputs.eligible == 'true' }}
        id: update-source-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: update-source-handoff-v${{ steps.identity.outputs.version }}-${{ steps.identity.outputs.source-sha }}
          path: artifacts/update-source-handoff/*
          if-no-files-found: error
          retention-days: 30
      - name: Summarize candidate for release approval
        if: ${{ steps.request.outputs.eligible == 'true' }}
        shell: pwsh
        env:
          NFC_VERSION: ${{ steps.identity.outputs.version }}
          NFC_SOURCE_SHA: ${{ steps.identity.outputs.source-sha }}
          NFC_PULL_REQUEST: ${{ steps.request.outputs.pull-request }}
        run: |
          $notesPath = './artifacts/release/RELEASE-NOTES.md'
          $notesDigest = (Get-FileHash -LiteralPath $notesPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $differenceLines = @(Get-Content -LiteralPath $notesPath | Where-Object {
            $_ -match '^#### ' -or $_ -match '^- Before . After:'
          })
          if ($differenceLines.Count -eq 0) { throw 'Release difference summary is missing.' }
          @(
            "## Release candidate v$env:NFC_VERSION"
            "Source SHA: ``$env:NFC_SOURCE_SHA``"
            "Release PR: #$env:NFC_PULL_REQUEST"
            "Release notes SHA-256: ``$notesDigest``"
            '### Difference summary'
            $differenceLines
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

  release-eligibility:
    name: release / eligibility
    needs:
      - candidate
      - v0916-parity-finalize
    if: ${{ always() && needs.candidate.result == 'success' && needs.candidate.outputs.dry-run != 'true' }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout protected release policy
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.candidate.outputs.workflow-sha }}
          persist-credentials: false
      - name: Setup pinned Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Require release eligibility
        shell: pwsh
        env:
          NFC_VERSION: ${{ needs.candidate.outputs.version }}
          NFC_PARITY_RESULT: ${{ needs.v0916-parity-finalize.result }}
        run: python ./scripts/release_promotion_policy.py validate-release-eligibility --version $env:NFC_VERSION --parity-result $env:NFC_PARITY_RESULT

  promote:
    name: release / promote
    needs:
      - candidate
      - release-eligibility
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.release-eligibility.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    env:
      NFC_RELEASE_POLICY: ./scripts/release_promotion_policy.py
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      - name: Checkout protected release authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.candidate.outputs.workflow-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup pinned Python for release policy
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install parity verification dependency
        if: ${{ needs.candidate.outputs.version == '2.0.0' }}
        shell: pwsh
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
      - name: Download terminal v0.9.16 parity evidence
        if: ${{ needs.candidate.outputs.version == '2.0.0' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: v0916-parity-terminal-${{ github.run_id }}
          path: artifacts/v0916-parity
      - name: Require terminal parity pass before promotion
        if: ${{ needs.candidate.outputs.version == '2.0.0' }}
        shell: pwsh
        run: python ./scripts/v0916_parity_certification.py validate-terminal --evidence ./artifacts/v0916-parity/terminal-evidence.json
      - name: Reconfirm release authority and source identity
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_TAG: ${{ needs.candidate.outputs.tag }}
          NFC_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          NFC_SOURCE_TREE: ${{ needs.candidate.outputs.source-tree }}
          NFC_SOURCE_BRANCH: ${{ needs.candidate.outputs.source-branch }}
          NFC_SOURCE_VERSION: ${{ needs.candidate.outputs.version }}
          NFC_WORKFLOW_SHA: ${{ needs.candidate.outputs.workflow-sha }}
        run: |
          $mainSha = git rev-parse HEAD
          $sourceBranchRef = "refs/remotes/origin/$env:NFC_SOURCE_BRANCH"
          $sourceBranchSha = git rev-parse --verify $sourceBranchRef
          $sourceCommitText = gh api "repos/$env:NFC_REPOSITORY/git/commits/$env:NFC_SOURCE_SHA"
          if ($LASTEXITCODE -ne 0) { throw 'Prepared source commit could not be read.' }
          $sourceCommit = $sourceCommitText | ConvertFrom-Json
          $observedSourceSha = [string]$sourceCommit.sha
          $observedSourceTree = [string]$sourceCommit.tree.sha
          $endpoint = "repos/$env:NFC_REPOSITORY/git/ref/tags/$env:NFC_TAG"
          $tagState = python $env:NFC_RELEASE_POLICY probe-resource --endpoint $endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Stable tag state could not be proved before promotion.' }
          git merge-base --is-ancestor $env:NFC_SOURCE_SHA $sourceBranchSha
          $sourceIsBranchAncestor = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          python $env:NFC_RELEASE_POLICY validate-promotion-source `
            --tag-state $tagState.Trim() `
            --source-sha $env:NFC_SOURCE_SHA `
            --source-tree $env:NFC_SOURCE_TREE `
            --checkout-sha $observedSourceSha `
            --checkout-tree $observedSourceTree `
            --source-branch $env:NFC_SOURCE_BRANCH `
            --source-version $env:NFC_SOURCE_VERSION `
            --source-branch-sha $sourceBranchSha `
            --workflow-sha $env:NFC_WORKFLOW_SHA `
            --main-sha $mainSha `
            --source-is-branch-ancestor $sourceIsBranchAncestor
          if ($LASTEXITCODE -ne 0) { throw 'Promotion release-authority/source policy failed.' }
      - name: Download prepared candidate assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: artifacts/release
      - name: Verify closed candidate identity and digests
        shell: pwsh
        env:
          NFC_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          NFC_SOURCE_TREE: ${{ needs.candidate.outputs.source-tree }}
          NFC_RUN_ID: ${{ github.run_id }}
          NFC_WORKFLOW_SHA: ${{ needs.candidate.outputs.workflow-sha }}
          NFC_WORKFLOW_REF: ${{ github.ref }}
          NFC_MANIFEST_NAME: ${{ needs.candidate.outputs.manifest-name }}
          NFC_MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
        run: |
          $manifest = Join-Path ./artifacts/release $env:NFC_MANIFEST_NAME
          if ((Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:NFC_MANIFEST_SHA256) {
            throw 'Downloaded candidate manifest digest differs from the prepared output.'
          }
          python $env:NFC_RELEASE_POLICY verify-manifest `
            --asset-dir ./artifacts/release `
            --manifest $manifest `
            --source-sha $env:NFC_SOURCE_SHA `
            --source-tree $env:NFC_SOURCE_TREE `
            --run-id $env:NFC_RUN_ID `
            --workflow-sha $env:NFC_WORKFLOW_SHA `
            --workflow-ref $env:NFC_WORKFLOW_REF
          if ($LASTEXITCODE -ne 0) { throw 'Downloaded candidate policy verification failed.' }
      - name: Create or verify immutable annotated tag with fresh repository admission
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_PULL_REQUEST: ${{ needs.candidate.outputs.pull-request }}
          NFC_REVIEW_HEAD_SHA: ${{ needs.candidate.outputs.review-head-sha }}
          NFC_MAIN_SHA: ${{ needs.candidate.outputs.workflow-sha }}
          NFC_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          NFC_SOURCE_BRANCH: ${{ needs.candidate.outputs.source-branch }}
          NFC_SOURCE_VERSION: ${{ needs.candidate.outputs.version }}
          NFC_TAG: ${{ needs.candidate.outputs.tag }}
          NFC_SOURCE_TREE: ${{ needs.candidate.outputs.source-tree }}
          NFC_RUN_ID: ${{ github.run_id }}
          NFC_MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
          NFC_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact-digest }}
        run: |
          $tagMessage = @"
          NVT FW Combiner $env:NFC_TAG
          candidate-run: $env:NFC_RUN_ID
          source-sha: $env:NFC_SOURCE_SHA
          source-tree: $env:NFC_SOURCE_TREE
          manifest-sha256: $env:NFC_MANIFEST_SHA256
          artifact-digest: $env:NFC_ARTIFACT_DIGEST
          "@.Trim()
          $tagMessagePath = Join-Path $env:RUNNER_TEMP 'candidate-tag-message.txt'
          Set-Content -LiteralPath $tagMessagePath -Value $tagMessage -Encoding utf8NoBOM -NoNewline
          $repositoryAdmissionPath = Join-Path $env:RUNNER_TEMP 'pretag-repository-admission.json'
          python $env:NFC_RELEASE_POLICY collect-repository-admission `
            --repository $env:NFC_REPOSITORY `
            --pull-request $env:NFC_PULL_REQUEST `
            --main-sha $env:NFC_MAIN_SHA `
            --review-head-sha $env:NFC_REVIEW_HEAD_SHA `
            --source-sha $env:NFC_SOURCE_SHA `
            --expected-tag $env:NFC_TAG `
            --output $repositoryAdmissionPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Fresh pre-tag repository admission policy failed.'
          }
          $mainBranchText = gh api "repos/$env:NFC_REPOSITORY/branches/main"
          if ($LASTEXITCODE -ne 0) { throw 'Fresh remote main protection evidence could not be read.' }
          try { $mainBranch = $mainBranchText | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "Fresh remote main protection evidence is malformed: $mainBranchText" }
          $sourceBranchText = gh api `
            "repos/$env:NFC_REPOSITORY/git/ref/heads/$env:NFC_SOURCE_BRANCH"
          if ($LASTEXITCODE -ne 0) { throw 'Fresh release-source branch evidence could not be read.' }
          try { $sourceBranch = $sourceBranchText | ConvertFrom-Json -ErrorAction Stop }
          catch { throw "Fresh release-source branch evidence is malformed: $sourceBranchText" }
          $observedSourceSha = [string]$sourceBranch.object.sha
          $tagEndpoint = "repos/$env:NFC_REPOSITORY/git/ref/tags/$env:NFC_TAG"
          $tagState = python $env:NFC_RELEASE_POLICY probe-resource --endpoint $tagEndpoint
          if ($LASTEXITCODE -ne 0) { throw 'Fresh stable tag state could not be proved.' }
          $tagState = $tagState.Trim()
          $sourceComparison = $null
          if ($tagState -eq 'present' -and $observedSourceSha -cne $env:NFC_SOURCE_SHA) {
            $comparisonText = gh api `
              "repos/$env:NFC_REPOSITORY/compare/$env:NFC_SOURCE_SHA...$observedSourceSha" `
              --jq '{baseSha: .base_commit.sha, mergeBaseSha: .merge_base_commit.sha, status: .status}'
            if ($LASTEXITCODE -ne 0) { throw 'Fresh recovery source ancestry could not be read.' }
            try { $comparison = $comparisonText | ConvertFrom-Json -ErrorAction Stop }
            catch { throw "Fresh recovery source ancestry is malformed: $comparisonText" }
            $sourceComparison = [ordered]@{
              baseSha = [string]$comparison.baseSha
              headSha = $observedSourceSha
              mergeBaseSha = [string]$comparison.mergeBaseSha
              status = [string]$comparison.status
            }
          }
          $liveAuthority = [ordered]@{
            tagState = $tagState
            remoteMain = [ordered]@{
              sha = [string]$mainBranch.commit.sha
              protected = $mainBranch.protected
            }
            remoteSource = [ordered]@{ sha = $observedSourceSha }
            sourceComparison = $sourceComparison
          }
          $liveAuthorityPath = Join-Path $env:RUNNER_TEMP 'pretag-live-branch-authority.json'
          $liveAuthority | ConvertTo-Json -Depth 5 | Set-Content `
            -LiteralPath $liveAuthorityPath -Encoding utf8NoBOM
          python $env:NFC_RELEASE_POLICY validate-live-branch-authority `
            --snapshot $liveAuthorityPath --main-sha $env:NFC_MAIN_SHA `
            --source-sha $env:NFC_SOURCE_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Fresh live branch authority policy failed.' }
          $endpoint = $tagEndpoint
          if ($tagState -eq 'absent') {
            python $env:NFC_RELEASE_POLICY validate-release-floor `
              --repository $env:NFC_REPOSITORY --version $env:NFC_SOURCE_VERSION `
              --tag-state $tagState
            if ($LASTEXITCODE -ne 0) { throw 'Fresh pre-tag release floor failed.' }
            $tagObject = gh api --method POST "repos/$env:NFC_REPOSITORY/git/tags" `
              -f "tag=$env:NFC_TAG" -f "message=$tagMessage" `
              -f "object=$env:NFC_SOURCE_SHA" -f 'type=commit' --jq .sha
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagObject)) {
              throw 'GitHub did not create the annotated tag object.'
            }
            gh api --method POST "repos/$env:NFC_REPOSITORY/git/refs" `
              -f "ref=refs/tags/$env:NFC_TAG" -f "sha=$tagObject" *> $null
            if ($LASTEXITCODE -ne 0) { throw 'GitHub did not create the stable tag ref.' }
          }
          elseif ($tagState -eq 'present') {
            $tagRefText = gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw 'Existing stable tag ref could not be read.' }
            $tagRefPath = Join-Path $env:RUNNER_TEMP 'existing-tag-ref.json'
            Set-Content -LiteralPath $tagRefPath -Value $tagRefText -Encoding utf8NoBOM
            $tagRef = $tagRefText | ConvertFrom-Json
            $tagObjectText = gh api "repos/$env:NFC_REPOSITORY/git/tags/$($tagRef.object.sha)"
            if ($LASTEXITCODE -ne 0) { throw 'Existing annotated tag object could not be read.' }
            $tagObjectPath = Join-Path $env:RUNNER_TEMP 'existing-tag-object.json'
            Set-Content -LiteralPath $tagObjectPath -Value $tagObjectText -Encoding utf8NoBOM
            python $env:NFC_RELEASE_POLICY validate-tag `
              --tag-ref $tagRefPath `
              --tag-object $tagObjectPath `
              --expected-tag $env:NFC_TAG `
              --source-sha $env:NFC_SOURCE_SHA `
              --expected-message $tagMessagePath
            if ($LASTEXITCODE -ne 0) {
              throw 'Existing stable tag does not match this exact prepared candidate.'
            }
          }
          else { throw 'Stable tag probe returned an unknown state.' }
      - name: Publish or validate GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_TAG: ${{ needs.candidate.outputs.tag }}
          NFC_MANIFEST_NAME: ${{ needs.candidate.outputs.manifest-name }}
          NFC_PULL_REQUEST: ${{ needs.candidate.outputs.pull-request }}
          NFC_REVIEW_HEAD_SHA: ${{ needs.candidate.outputs.review-head-sha }}
          NFC_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          NFC_SOURCE_BRANCH: ${{ needs.candidate.outputs.source-branch }}
          NFC_SOURCE_VERSION: ${{ needs.candidate.outputs.version }}
          NFC_WORKFLOW_SHA: ${{ needs.candidate.outputs.workflow-sha }}
        run: |
          function Assert-LiveReleaseMutationAuthority {
            $repositoryAdmissionPath = Join-Path $env:RUNNER_TEMP `
              'release-mutation-repository-admission.json'
            python $env:NFC_RELEASE_POLICY collect-repository-admission `
              --repository $env:NFC_REPOSITORY `
              --pull-request $env:NFC_PULL_REQUEST `
              --main-sha $env:NFC_WORKFLOW_SHA `
              --review-head-sha $env:NFC_REVIEW_HEAD_SHA `
              --source-sha $env:NFC_SOURCE_SHA `
              --expected-tag $env:NFC_TAG `
              --output $repositoryAdmissionPath
            if ($LASTEXITCODE -ne 0) {
              throw 'Release-mutation repository admission policy failed.'
            }
            $mainBranchText = gh api "repos/$env:NFC_REPOSITORY/branches/main"
            if ($LASTEXITCODE -ne 0) { throw 'Release-mutation remote main evidence could not be read.' }
            try { $mainBranch = $mainBranchText | ConvertFrom-Json -ErrorAction Stop }
            catch { throw "Release-mutation remote main evidence is malformed: $mainBranchText" }
            $sourceBranchText = gh api `
              "repos/$env:NFC_REPOSITORY/git/ref/heads/$env:NFC_SOURCE_BRANCH"
            if ($LASTEXITCODE -ne 0) { throw 'Release-mutation source-branch evidence could not be read.' }
            try { $sourceBranch = $sourceBranchText | ConvertFrom-Json -ErrorAction Stop }
            catch { throw "Release-mutation source-branch evidence is malformed: $sourceBranchText" }
            $observedSourceSha = [string]$sourceBranch.object.sha
            $sourceComparison = $null
            if ($observedSourceSha -cne $env:NFC_SOURCE_SHA) {
              $comparisonText = gh api `
                "repos/$env:NFC_REPOSITORY/compare/$env:NFC_SOURCE_SHA...$observedSourceSha" `
                --jq '{baseSha: .base_commit.sha, mergeBaseSha: .merge_base_commit.sha, status: .status}'
              if ($LASTEXITCODE -ne 0) { throw 'Release-mutation source ancestry could not be read.' }
              try { $comparison = $comparisonText | ConvertFrom-Json -ErrorAction Stop }
              catch { throw "Release-mutation source ancestry is malformed: $comparisonText" }
              $sourceComparison = [ordered]@{
                baseSha = [string]$comparison.baseSha
                headSha = $observedSourceSha
                mergeBaseSha = [string]$comparison.mergeBaseSha
                status = [string]$comparison.status
              }
            }
            $liveAuthority = [ordered]@{
              tagState = 'present'
              remoteMain = [ordered]@{
                sha = [string]$mainBranch.commit.sha
                protected = $mainBranch.protected
              }
              remoteSource = [ordered]@{ sha = $observedSourceSha }
              sourceComparison = $sourceComparison
            }
            $liveAuthorityPath = Join-Path $env:RUNNER_TEMP 'release-mutation-live-authority.json'
            $liveAuthority | ConvertTo-Json -Depth 5 | Set-Content `
              -LiteralPath $liveAuthorityPath -Encoding utf8NoBOM
            python $env:NFC_RELEASE_POLICY validate-live-branch-authority `
              --snapshot $liveAuthorityPath --main-sha $env:NFC_WORKFLOW_SHA `
              --source-sha $env:NFC_SOURCE_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Release-mutation live branch authority failed.' }
          }
          $releaseRoot = Resolve-Path -LiteralPath ./artifacts/release
          $notesPath = Join-Path $releaseRoot 'RELEASE-NOTES.md'
          $manifestPath = Join-Path $releaseRoot $env:NFC_MANIFEST_NAME
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $checksumName = "NvtFwCombiner-v$($manifest.version)-assets.sha256"
          $expectedNames = @($manifest.assets.name) + @($env:NFC_MANIFEST_NAME, $checksumName)
          $endpoint = "repos/$env:NFC_REPOSITORY/releases/tags/$env:NFC_TAG"
          $state = python $env:NFC_RELEASE_POLICY probe-resource --endpoint $endpoint
          if ($LASTEXITCODE -ne 0) { throw 'Release state could not be proved.' }
          if ($state.Trim() -eq 'absent') {
            $assets = @($expectedNames | ForEach-Object { Join-Path $releaseRoot $_ })
            Assert-LiveReleaseMutationAuthority
            gh release create $env:NFC_TAG @assets --repo $env:NFC_REPOSITORY `
              --verify-tag --title "NVT FW Combiner $env:NFC_TAG" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw 'GitHub Release publication failed.' }
          }
          elseif ($state.Trim() -eq 'present') {
            $releaseText = gh api $endpoint
            if ($LASTEXITCODE -ne 0) { throw 'Existing Release REST metadata could not be read.' }
            $releasePath = Join-Path $env:RUNNER_TEMP 'existing-release.json'
            Set-Content -LiteralPath $releasePath -Value $releaseText -Encoding utf8NoBOM
            $publishedNamesPath = Join-Path $env:RUNNER_TEMP 'published-names.json'
            $publishedNamesText = python $env:NFC_RELEASE_POLICY validate-release `
              --release $releasePath --expected-tag $env:NFC_TAG `
              --expected-body $notesPath --manifest $manifestPath
            if ($LASTEXITCODE -ne 0) { throw 'Existing Release metadata conflicts with the prepared candidate.' }
            Set-Content -LiteralPath $publishedNamesPath -Value $publishedNamesText -Encoding utf8NoBOM
            $published = Join-Path $env:RUNNER_TEMP 'existing-release-assets'
            New-Item -ItemType Directory -Force -Path $published | Out-Null
            if (@($publishedNamesText | ConvertFrom-Json).Count -gt 0) {
              gh release download $env:NFC_TAG --repo $env:NFC_REPOSITORY --dir $published
              if ($LASTEXITCODE -ne 0) { throw 'Existing Release assets could not be downloaded.' }
            }
            $missingJson = python $env:NFC_RELEASE_POLICY plan-recovery `
              --manifest $manifestPath --published-dir $published --published-names $publishedNamesPath
            if ($LASTEXITCODE -ne 0) { throw 'Existing Release asset recovery policy failed.' }
            $missingNames = @($missingJson | ConvertFrom-Json)
            if ($missingNames.Count -gt 0) {
              $missingAssets = @($missingNames | ForEach-Object { Join-Path $releaseRoot $_ })
              Assert-LiveReleaseMutationAuthority
              gh release upload $env:NFC_TAG @missingAssets --repo $env:NFC_REPOSITORY
              if ($LASTEXITCODE -ne 0) { throw 'Missing Release asset upload failed.' }
            }
          }
          else { throw 'Release probe returned an unknown state.' }
      - name: Verify published assets and source downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_TAG: ${{ needs.candidate.outputs.tag }}
          NFC_MANIFEST_NAME: ${{ needs.candidate.outputs.manifest-name }}
          NFC_SOURCE_SHA: ${{ needs.candidate.outputs.source-sha }}
          NFC_SOURCE_TREE: ${{ needs.candidate.outputs.source-tree }}
          NFC_RUN_ID: ${{ github.run_id }}
          NFC_MANIFEST_SHA256: ${{ needs.candidate.outputs.manifest-sha256 }}
          NFC_ARTIFACT_DIGEST: ${{ needs.candidate.outputs.artifact-digest }}
        run: |
          $releaseRoot = Resolve-Path -LiteralPath ./artifacts/release
          $manifestPath = Join-Path $releaseRoot $env:NFC_MANIFEST_NAME
          $notesPath = Join-Path $releaseRoot 'RELEASE-NOTES.md'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $fresh = Join-Path $env:RUNNER_TEMP 'published-release'
          New-Item -ItemType Directory -Force -Path $fresh | Out-Null
          gh release download $env:NFC_TAG --repo $env:NFC_REPOSITORY --dir $fresh
          if ($LASTEXITCODE -ne 0) { throw 'Published assets could not be downloaded.' }
          $tagMessage = @"
          NVT FW Combiner $env:NFC_TAG
          candidate-run: $env:NFC_RUN_ID
          source-sha: $env:NFC_SOURCE_SHA
          source-tree: $env:NFC_SOURCE_TREE
          manifest-sha256: $env:NFC_MANIFEST_SHA256
          artifact-digest: $env:NFC_ARTIFACT_DIGEST
          "@.Trim()
          $tagMessagePath = Join-Path $env:RUNNER_TEMP 'final-tag-message.txt'
          Set-Content -LiteralPath $tagMessagePath -Value $tagMessage -Encoding utf8NoBOM -NoNewline
          $tagRefText = gh api "repos/$env:NFC_REPOSITORY/git/ref/tags/$env:NFC_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Published stable tag ref could not be read.' }
          $tagRefPath = Join-Path $env:RUNNER_TEMP 'final-tag-ref.json'
          Set-Content -LiteralPath $tagRefPath -Value $tagRefText -Encoding utf8NoBOM
          $tagRef = $tagRefText | ConvertFrom-Json
          $tagObjectText = gh api "repos/$env:NFC_REPOSITORY/git/tags/$($tagRef.object.sha)"
          if ($LASTEXITCODE -ne 0) { throw 'Published annotated tag object could not be read.' }
          $tagObjectPath = Join-Path $env:RUNNER_TEMP 'final-tag-object.json'
          Set-Content -LiteralPath $tagObjectPath -Value $tagObjectText -Encoding utf8NoBOM
          python $env:NFC_RELEASE_POLICY validate-tag `
            --tag-ref $tagRefPath --tag-object $tagObjectPath `
            --expected-tag $env:NFC_TAG --source-sha $env:NFC_SOURCE_SHA `
            --expected-message $tagMessagePath
          if ($LASTEXITCODE -ne 0) { throw 'Published stable tag identity is invalid.' }
          $releaseEndpoint = "repos/$env:NFC_REPOSITORY/releases/tags/$env:NFC_TAG"
          $releaseText = gh api $releaseEndpoint
          if ($LASTEXITCODE -ne 0) { throw 'Published Release REST metadata could not be read.' }
          $releasePath = Join-Path $env:RUNNER_TEMP 'final-release.json'
          Set-Content -LiteralPath $releasePath -Value $releaseText -Encoding utf8NoBOM
          $publishedNamesPath = Join-Path $env:RUNNER_TEMP 'final-published-names.json'
          $publishedNamesText = python $env:NFC_RELEASE_POLICY validate-release `
            --release $releasePath --expected-tag $env:NFC_TAG `
            --expected-body $notesPath --manifest $manifestPath
          if ($LASTEXITCODE -ne 0) { throw 'Published Release metadata conflicts with the candidate.' }
          Set-Content -LiteralPath $publishedNamesPath -Value $publishedNamesText -Encoding utf8NoBOM
          $missingJson = python $env:NFC_RELEASE_POLICY plan-recovery `
            --manifest $manifestPath --published-dir $fresh `
            --published-names $publishedNamesPath
          if ($LASTEXITCODE -ne 0 -or @($missingJson | ConvertFrom-Json).Count -ne 0) {
            throw 'Published Release asset set is incomplete or conflicting.'
          }
          Invoke-WebRequest -Uri "https://github.com/$env:NFC_REPOSITORY/archive/refs/tags/$env:NFC_TAG.zip" -Method Head | Out-Null
          Invoke-WebRequest -Uri "https://github.com/$env:NFC_REPOSITORY/archive/refs/tags/$env:NFC_TAG.tar.gz" -Method Head | Out-Null

  published-smoke:
    name: release / published-smoke
    if: ${{ !cancelled() && needs.candidate.result == 'success' && needs.promote.result == 'success' }}
    needs:
      - candidate
      - promote
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout protected release authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.candidate.outputs.workflow-sha }}
          persist-credentials: false
      - name: Download published package with read-only authority
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NFC_REPOSITORY: ${{ github.repository }}
          NFC_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          $fresh = Join-Path $env:RUNNER_TEMP 'published-package-smoke'
          New-Item -ItemType Directory -Force -Path $fresh | Out-Null
          gh release download $env:NFC_TAG --repo $env:NFC_REPOSITORY --dir $fresh `
            --pattern "NvtFwCombiner-$env:NFC_TAG-win-x64*"
          if ($LASTEXITCODE -ne 0) { throw 'Published package could not be downloaded for smoke.' }
      - name: Smoke published package without a GitHub token
        shell: pwsh
        env:
          NFC_TAG: ${{ needs.candidate.outputs.tag }}
        run: |
          if ((Test-Path Env:GH_TOKEN) -or (Test-Path Env:GITHUB_TOKEN)) {
            throw 'Published package smoke must not receive a GitHub token.'
          }
          $package = Join-Path $env:RUNNER_TEMP `
            "published-package-smoke/NvtFwCombiner-$env:NFC_TAG-win-x64.zip"
          ./scripts/smoke-release.ps1 -PackagePath $package -SkipUiLaunch

  v0916-parity-compare:
    name: release / v0.9.16 parity compare
    needs:
      - candidate
    if: ${{ success() && needs.candidate.outputs.dry-run != 'true' && needs.candidate.outputs.version == '2.0.0' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout authenticated parity workflow authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup pinned Python for parity verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install parity verification dependency
        shell: pwsh
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
      - name: Download exact candidate assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: artifacts/release
      - name: Execute v0.9.16 parity comparison
        shell: pwsh
        run: python ./scripts/v0916_parity_certification.py compare --plan ./docs/contracts/v0916-parity-certification-v1.json --candidate-artifact-dir ./artifacts/release --output-root ./artifacts/v0916-parity
      - name: Upload immutable parity comparison
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: v0916-parity-comparison-${{ github.run_id }}
          path: artifacts/v0916-parity/comparison.json
          retention-days: 30

  v0916-parity-attestation:
    name: release / v0.9.16 parity attestation
    needs:
      - candidate
      - v0916-parity-compare
    if: ${{ success() && needs.candidate.outputs.dry-run != 'true' && needs.candidate.outputs.version == '2.0.0' }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: firmware-parity
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout authenticated parity workflow authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup pinned Python for parity verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install parity verification dependency
        shell: pwsh
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
      - name: Download same-run parity comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: v0916-parity-comparison-${{ github.run_id }}
          path: artifacts/v0916-parity
      - name: Decode independently produced firmware-owner material
        shell: pwsh
        env:
          NFC_OWNER_ATTESTATION_B64: ${{ secrets.NFC_FIRMWARE_OWNER_ATTESTATION_B64 }}
          NFC_OWNER_VERIFICATION_B64: ${{ secrets.NFC_FIRMWARE_OWNER_VERIFICATION_B64 }}
          NFC_OWNER_VERIFIER_ID: ${{ secrets.NFC_FIRMWARE_OWNER_VERIFIER_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NFC_OWNER_ATTESTATION_B64) -or
              [string]::IsNullOrWhiteSpace($env:NFC_OWNER_VERIFICATION_B64) -or
              [string]::IsNullOrWhiteSpace($env:NFC_OWNER_VERIFIER_ID)) {
            throw 'Independent firmware-owner attestation, verification record, and verifier id are required.'
          }
          [IO.File]::WriteAllBytes(
            (Join-Path (Resolve-Path ./artifacts/v0916-parity) 'owner-attestation.json'),
            [Convert]::FromBase64String($env:NFC_OWNER_ATTESTATION_B64))
          [IO.File]::WriteAllBytes(
            (Join-Path (Resolve-Path ./artifacts/v0916-parity) 'external-verification.json'),
            [Convert]::FromBase64String($env:NFC_OWNER_VERIFICATION_B64))
          python ./scripts/v0916_parity_certification.py validate-owner-material `
            --comparison ./artifacts/v0916-parity/comparison.json `
            --attestation ./artifacts/v0916-parity/owner-attestation.json `
            --verification-record ./artifacts/v0916-parity/external-verification.json `
            --verifier-id $env:NFC_OWNER_VERIFIER_ID
          if ($LASTEXITCODE -ne 0) { throw 'Independent firmware-owner material failed validation.' }
      - name: Upload immutable owner attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: v0916-parity-attestation-${{ github.run_id }}
          path: artifacts/v0916-parity/owner-attestation.json
          retention-days: 30
      - name: Upload immutable external verification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: v0916-parity-verification-${{ github.run_id }}
          path: artifacts/v0916-parity/external-verification.json
          retention-days: 30
  v0916-parity-finalize:
    name: release / v0.9.16 parity finalize
    needs:
      - candidate
      - v0916-parity-attestation
    if: ${{ success() && needs.candidate.outputs.dry-run != 'true' && needs.candidate.outputs.version == '2.0.0' }}
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      deployments: read
    steps:
      - name: Checkout authenticated parity workflow authority
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
      - name: Setup pinned Python for parity verification
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - name: Install parity verification dependency
        shell: pwsh
        run: 'python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3'
      - name: Download same-run parity comparison
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: v0916-parity-comparison-${{ github.run_id }}
          path: artifacts/v0916-parity
      - name: Download same-run owner attestation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: v0916-parity-attestation-${{ github.run_id }}
          path: artifacts/v0916-parity
      - name: Download same-run external verification
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: v0916-parity-verification-${{ github.run_id }}
          path: artifacts/v0916-parity
      - name: Finalize exact v2.0.0 parity evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $verification = Get-Content -LiteralPath `
            ./artifacts/v0916-parity/external-verification.json -Raw | ConvertFrom-Json
          $verifierId = [string]$verification.verifierId
          if ([string]::IsNullOrWhiteSpace($verifierId)) {
            throw 'External firmware-owner verifier id is missing.'
          }
          python ./scripts/v0916_parity_certification.py finalize-protected `
            --comparison ./artifacts/v0916-parity/comparison.json `
            --attestation ./artifacts/v0916-parity/owner-attestation.json `
            --verification-record ./artifacts/v0916-parity/external-verification.json `
            --verifier-id $verifierId `
            --repository ${{ github.repository }} `
            --run-id ${{ github.run_id }} `
            --workflow-sha ${{ github.workflow_sha }} `
            --output ./artifacts/v0916-parity/terminal-evidence.json
          if ($LASTEXITCODE -ne 0) { throw 'Terminal v2.0.0 parity finalization failed.' }
      - name: Upload terminal parity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          if-no-files-found: error
          name: v0916-parity-terminal-${{ github.run_id }}
          path: artifacts/v0916-parity/terminal-evidence.json
          retention-days: 30
