name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing approved stable SemVer tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  package:
    name: release / package
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    steps:
      - name: Validate stable tag input
        shell: pwsh
        run: |
          if ('${{ inputs.tag }}' -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release requires a stable SemVer tag in vX.Y.Z form.'
          }
      - name: Checkout approved tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Confirm checked-out commit is exactly tagged
        shell: pwsh
        run: |
          git rev-parse --verify 'refs/tags/${{ inputs.tag }}'
          if ((git rev-list -n 1 '${{ inputs.tag }}') -ne (git rev-parse HEAD)) {
            throw 'Checked-out commit does not match the requested tag.'
          }
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable reviewed commit
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Add repository .NET to PATH
        shell: pwsh
        run: |
          "${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install worker verification and packaging dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev,package]'
      - name: Verify release source
        run: python ./scripts/verify.py --all
      - name: Build closed-allowlist release package
        shell: pwsh
        run: ./scripts/package.ps1 -Version '${{ inputs.tag }}' -Commit '${{ github.sha }}'
      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create '${{ inputs.tag }}' ./artifacts/release/* --verify-tag --generate-notes
