name: main-package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package / win-x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Add repository .NET to PATH
        shell: pwsh
        run: |
          "${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install worker verification and packaging dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev,package]'
      - name: Verify package source
        run: python ./scripts/verify.py --all
      - name: Resolve package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          "NFC_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build self-contained Windows artifact
        shell: pwsh
        run: ./scripts/package.ps1 -Version "$env:NFC_PACKAGE_VERSION" -Commit '${{ github.sha }}' -AllowPrerelease
      - name: Upload self-contained package
        id: upload-package-artifact
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nvt-fw-combiner-${{ github.sha }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
      - name: Publish package fallback prerelease
        if: steps.upload-package-artifact.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'
          $shortSha = $sha.Substring(0, 12)
          $tag = "main-package-$shortSha"
          $repo = '${{ github.repository }}'
          $title = "Main package $shortSha"
          $notes = "Automated main package for commit $sha. Created because GitHub Actions artifact upload was unavailable."
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag ./artifacts/release/* --repo $repo --clobber
            gh release edit $tag --repo $repo --prerelease --title $title --notes $notes
          }
          else {
            gh release create $tag ./artifacts/release/* --repo $repo --target $sha --prerelease --title $title --notes $notes
          }
