name: main-package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package / win-x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Add repository .NET to PATH
        shell: pwsh
        run: |
          "${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=${{ github.workspace }}\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install worker verification and packaging dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev,package]'
      - name: Verify package source
        run: python ./scripts/verify.py --all
      - name: Resolve package version
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath ./VERSION -Raw).Trim()
          "NFC_PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build self-contained Windows artifact
        shell: pwsh
        run: ./scripts/package.ps1 -Version "$env:NFC_PACKAGE_VERSION" -Commit '${{ github.sha }}' -AllowPrerelease
      - name: Smoke packaged allowlist and worker
        shell: pwsh
        run: ./scripts/smoke-release.ps1 -PackagePath "./artifacts/release/NvtFwCombiner-v$env:NFC_PACKAGE_VERSION-win-x64.zip" -SkipUiLaunch
      - name: Upload self-contained package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvt-fw-combiner-${{ github.sha }}-win-x64
          path: artifacts/release/*
          if-no-files-found: error
          retention-days: 3
