name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  structure:
    name: policy / polytail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable reviewed commit
        with:
          python-version: '3.13'
      - name: Validate structure, policy, contracts, and provenance
        run: python scripts/verify.py --structure-only

  python-worker:
    name: python-worker / verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # immutable reviewed commit
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/crc-worker/pyproject.toml
      - name: Install worker verification dependencies
        run: python -m pip install --disable-pip-version-check -e './tools/crc-worker[dev]'
      - name: Verify worker and repository policy
        run: python scripts/verify.py --skip-dotnet

  dotnet:
    name: dotnet / build-test
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned repository .NET SDK
        shell: pwsh
        run: ./scripts/install-dotnet.ps1 -Scope Repository
      - name: Add resolved .NET to PATH
        shell: pwsh
        run: |
          $repoDotnet = "${{ github.workspace }}\.dotnet\dotnet.exe"
          if (Test-Path -LiteralPath $repoDotnet -PathType Leaf) {
            $dotnetRoot = Split-Path -Parent $repoDotnet
          } else {
            $dotnetRoot = Split-Path -Parent (Get-Command dotnet -ErrorAction Stop).Source
          }
          $dotnetRoot | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "DOTNET_ROOT=$dotnetRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $dotnetRoot 'dotnet.exe') --version
      - name: .NET version
        shell: pwsh
        run: dotnet --version
      - name: Restore solution
        shell: pwsh
        run: dotnet restore NvtFwCombiner.slnx
      - name: Verify dotnet whitespace formatting
        shell: pwsh
        run: dotnet format whitespace NvtFwCombiner.slnx --verify-no-changes --no-restore
      - name: Build solution
        shell: pwsh
        run: dotnet build NvtFwCombiner.slnx -c Release --no-restore
      - name: Test solution
        shell: pwsh
        run: dotnet test NvtFwCombiner.slnx -c Release --no-build
