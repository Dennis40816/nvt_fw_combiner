version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "dotnet"]
    ignore:
      # JsonSchema.Net 9.0.0 added a maintenance-fee EULA to its binary packages.
      # The owner keeps the audited 8.0.5 (board decision 346, pull request 642).
      - dependency-name: "JsonSchema.Net"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /tools/crc-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python-worker"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
