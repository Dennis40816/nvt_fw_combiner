version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "dotnet"]

  - package-ecosystem: pip
    directory: /tools/crc-worker
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "python-worker"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
