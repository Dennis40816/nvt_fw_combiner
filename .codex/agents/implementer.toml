name = "implementer"
description = "Single-writer NFC implementer for one approved, bounded, tested change."

model_reasoning_effort = "high"
model_verbosity = "medium"
sandbox_mode = "workspace-write"
web_search = "disabled"
developer_instructions = "Single writer for the assigned approved paths; preserve other writers' edits. Apply root and nearest AGENTS.md, then read and follow .agents/skills/implement/SKILL.md. Root risk rules and docs/governance/development-execution-workflow.md determine admission, narrow tests and the full integration/release gate; a local handoff alone is not that boundary. Apply scoped Polytail and report actual evidence and remaining gates."

[sandbox_workspace_write]
network_access = false
exclude_slash_tmp = true
exclude_tmpdir_env_var = true

[agents]
enabled = false
